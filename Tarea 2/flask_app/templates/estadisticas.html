<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Estadísticas de Avisos de Adopción</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_estadisticas.css') }}" />
</head>
<body>
  <header class="header">
    <h1>Estadísticas de Avisos de Adopción</h1>
  </header>

  <main class="grid">
    <figure class="figura">
      <img src="{{ url_for('static', filename='img/Grafico1.png') }}" alt="Gráfico de líneas: cantidad de avisos de adopción por día" />
    </figure>

    <figure class="figura">
      <img src="{{ url_for('static', filename='img/Grafico2.png') }}" alt="Gráfico de torta: total de avisos por tipo de mascota (gatos y perros)" />
    </figure>

    <figure class="figura">
      <img src="{{ url_for('static', filename='img/Grafico3.png') }}" alt="Gráfico de barras: avisos por mes, comparando gatos y perros" />
    </figure>
  </main>

  <footer class="footer">
    <a class="back-link" href="/">Volver a la página de inicio</a>
  </footer>
</body>
</html>
