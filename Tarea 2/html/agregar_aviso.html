<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Agregar Aviso de Adopción</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="../css/styles_agregar_aviso.css">
    </head>
    <body>
        <div class="main-container">
            <div id="val-box" hidden>
                <h2 id ="val-msg"></h2>
                <ul id="val-list"></ul>
            </div>
            <form name="agregar-aviso" method="post" action="http://127.0.0.1:5000/avisos" enctype="multipart/form-data">
                <label for="select-region">Región</label>
                <select id="select-region" name="select-region" required>
                    <option value="" disabled selected>Seleccione una región</option>
                    <option value="Región Arica y Parinacota">Región de Arica y Parinacota</option>
                    <option value="Región de Tarapacá">Región de Tarapacá</option>
                    <option value="Región de Antofagasta">Región de Antofagasta</option>
                    <option value="Región de Atacama">Región de Atacama</option>
                    <option value="Región de Coquimbo">Región de Coquimbo</option>
                    <option value="Región de Valparaíso">Región de Valparaíso</option>
                    <option value="Región Metropolitana de Santiago">Región Metropolitana</option>
                    <option value="Región del Libertador Bernardo O'Higgins">Región de O'Higgins</option>
                    <option value="Región del Maule">Región del Maule</option>
                    <option value="Región del Ñuble">Región de Ñuble</option>
                    <option value="Región del Biobío">Región del Biobío</option>
                    <option value="Región de La Araucanía">Región de La Araucanía</option>
                    <option value="Región de Los Ríos">Región de Los Ríos</option>
                    <option value="Región de Los Lagos">Región de Los Lagos</option>
                    <option value="Región Aisén del General Carlos Ibáñez del Campo">Región de Aysén</option>
                    <option value="Región de Magallanes y la Antártica Chilena">Región de Magallanes</option>
                </select><br>
                
                <label for="select-comuna">Comuna</label>
                <select id="select-comuna" name="select-comuna" required>
                    <option value="" disabled selected>Seleccione una comuna</option>
                </select><br>

                <label for="sector">Sector:</label>
                <input type="text" id="sector" name="sector" maxlength="100" placeholder="Elija un sector"><br>

                <label for="nombre">Nombre de contacto:</label>
                <input type="text" id="nombre" name="nombre" minlength="3" maxlength="200" placeholder="Escriba su nombre" required><br>
                
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" maxlength="100" placeholder="Escriba su correo electrónico" required><br>

                <label for="telefono">Número de teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Escriba su número de teléfono en formato +NNN.NNNNNNNN"><br>

                <label for="medio-contacto">Medio(s) de contacto:</label>
                <div id="medio-contacto">
                    <label><input id="cb-whatsapp" name="cb-whatsapp" type="checkbox" value="WhatsApp">WhatsApp</label>
                    <div id="whatsapp-nombre" class="medio-input" style="display:none;">
                        <input type="text" id="whatsapp" name="whatsapp" minlength="4" maxlength="50" placeholder="Escriba su número de Whatsapp">
                    </div>

                    <label><input id="cb-telegram" name="cb-telegram" type="checkbox" value="Telegram">Telegram</label>
                    <div id="telegram-nombre" class="medio-input" style="display:none;">
                        <input type="text" id="telegram" name="telegram" minlength="4" maxlength="50" placeholder="Escriba su nombre de usuario de Telegram">
                    </div>

                    <label><input id="cb-x" name="cb-x" type="checkbox" value="X">X</label>
                    <div id="x-nombre" class="medio-input" style="display:none;">
                        <input type="text" id="x" name="x" minlength="4" maxlength="50" placeholder="Escriba su nombre de usuario de X">
                    </div>

                    <label><input id="cb-instagram" name="cb-instagram" type="checkbox" value="Instagram">Instagram</label>
                    <div id="instagram-nombre" class="medio-input" style="display:none;">
                        <input type="text" id="instagram" name="instagram" minlength="4" maxlength="50" placeholder="Escriba su nombre de usuario de Instagram">
                    </div>

                    <label><input id="cb-tiktok" name="cb-tiktok" type="checkbox" value="TikTok">TikTok</label>
                    <div id="tiktok-nombre" class="medio-input" style="display:none;">
                        <input type="text" id="tiktok" name="tiktok" minlength="4" maxlength="100" placeholder="Escriba su nombre de usuario de TikTok">
                    </div>

                    <label><input id="cb-otro" name="cb-otro" type="checkbox" value="Otro">Otro</label>
                    <div id="otro-nombre" class="medio-input" style="display:none;">
                        <input type="text" id="otro" name="otro" minlength="4" maxlength="100" placeholder="Escriba el otro medio de contacto">
                    </div>
                </div>
                
                <label for="select-tipo-mascota">Tipo de mascota:</label>
                <select id="select-tipo-mascota" name="select-tipo-mascota" required>
                    <option value="" disabled selected>Seleccione un tipo</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                </select><br>
                
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" min="1" placeholder="Introduzca la cantidad de mascotas a dar en adopción" required><br>
                
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="1" placeholder="Introduzca la edad de su(s) mascota(s)" required><br>
                
                <label for="select-unidad-edad">Unidad de edad:</label>
                <select id="select-unidad-edad" name="select-unidad-edad" required>
                    <option value="" disabled selected>Seleccione una unidad</option>
                    <option value="Meses">Meses</option>
                    <option value="Años">Años</option>
                </select><br>

                <label for="fecha-entrega">Fecha disponible para entrega:</label>
                <input type="datetime-local" id="fecha-entrega" name="fecha-entrega" required><br>
                
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" cols="50" rows="10" placeholder="Escriba una breve descripción de su(s) mascota(s)"></textarea><br>
                
                <label for="foto">Fotos de la mascota (máximo 5):</label>
                <div id="foto-container">
                    <input type="file" id="foto" name="foto" multiple accept="image/*,.pdf" required>
                </div>
                <button type="button" id="btn-agregar-foto">Agregar otra foto</button>
                <p id="mensaje-error" style="color:red; display: none;">No puedes agregar más de 5 fotos!</p>

                <button type="button" id="btn-enviar">Enviar Aviso de Adopción</button>
            </form>
        </div>
        <script src="../js/comunas.js"></script>
        <script src="../js/contacto.js"></script>
        <script src="../js/medios.js"></script>
        <script src="../js/agregarFotos.js"></script>
        <script src="../js/validaciones.js"></script>
    </body>
</html>
